# ---------------------------------------------------------------
#  DATABASE CONNECTION  (edit these 3 lines, or set env variables)
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/themepark?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Run schema.sql + data.sql on startup. Both are safe to re-run
# (CREATE TABLE IF NOT EXISTS / INSERT IGNORE). Use DB_INIT=never to skip.
spring.sql.init.mode=${DB_INIT:always}

server.port=${PORT:8080}
# Visitor/staff session timeout (edge case: session expires mid-booking)
server.servlet.session.timeout=30m

# Create ride slots for the next 7 days on startup if missing
app.seed-slots=true
